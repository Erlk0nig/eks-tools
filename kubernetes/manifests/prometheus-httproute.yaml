apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy-gateway-system
  hostnames:
  - ${prometheus_hostname}
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-prometheus
      port: 9090